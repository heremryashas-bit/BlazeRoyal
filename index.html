<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firegrounds - PUBG + FreeFire Web</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: Arial; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; z-index: 10; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="ui">Health: <span id="health">100</span> | Score: <span id="score">0</span></div>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
            scene: {
                preload: function() {
                    // Free CC0 assets (Kenney/Opengameart)
                    this.load.image('map', 'https://opengameart.org/sites/default/files/tilset_512.png'); // PUBG-style island
                    this.load.spritesheet('player', 'https://opengameart.org/sites/default/files/green_tank_small.png', { frameWidth: 32, frameHeight: 32 }); // FreeFire-style character
                    this.load.image('bullet', 'https://opengameart.org/sites/default/files/bullet_2.png');
                    this.load.image('car', 'https://opengameart.org/sites/default/files/car.png'); // PUBG vehicle
                    this.load.image('enemy', 'https://opengameart.org/sites/default/files/red_tank_small.png');
                },
                create: function() {
                    this.add.image(400, 300, 'map').setScale(1.5); // Large PUBG map
                    this.player = this.physics.add.sprite(100, 500, 'player');
                    this.player.setCollideWorldBounds(true);
                    this.player.health = 100;
                    this.cursors = this.input.keyboard.createCursorKeys();
                    this.bullets = this.physics.add.group();
                    // FreeFire dash (space double-tap)
                    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
                    // PUBG vehicle loot
                    this.car = this.physics.add.sprite(600, 400, 'car');
                    // Bots (FreeFire fast AI)
                    this.enemies = this.physics.add.group();
                    for (let i = 0; i < 5; i++) {
                        let enemy = this.enemies.create(Phaser.Math.Between(200, 800), Phaser.Math.Between(100, 500), 'enemy');
                    }
                    this.physics.add.collider(this.player.bullets, this.enemies, this.hitEnemy, null, this);
                },
                update: function() {
                    this.player.setVelocity(0);
                    if (this.cursors.left.isDown) this.player.setVelocityX(-300); // FreeFire speed
                    if (this.cursors.right.isDown) this.player.setVelocityX(300);
                    if (this.cursors.up.isDown) this.player.setVelocityY(-300);
                    if (this.cursors.down.isDown) this.player.setVelocityY(300);
                    // Shoot
                    if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) {
                        let bullet = this.bullets.create(this.player.x + 20, this.player.y, 'bullet');
                        bullet.setVelocityX(500); // Fast FreeFire shoot
                        bullet.setVelocityY(0);
                    }
                    // Enemy AI chase (FreeFire intense)
                    this.enemies.children.entries.forEach(enemy => {
                        this.physics.moveToObject(enemy, this.player, 150);
                    });
                    // Vehicle enter (PUBG style)
                    if (Phaser.Geom.Intersects.RectangleToRectangle(this.player.getBounds(), this.car.getBounds())) {
                        this.player.setVelocity(400, 0); // Drive fast
                    }
                },
                hitEnemy: function(bullet, enemy) {
                    enemy.destroy();
                    bullet.destroy();
                    document.getElementById('score').textContent = parseInt(document.getElementById('score').textContent) + 10;
                }
            }
        };
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
